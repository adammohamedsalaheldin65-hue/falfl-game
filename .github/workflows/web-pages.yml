name: Build V12.4 Mobile Preview + Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply latest V12.4 mobile preview overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f .web_preview/felfel_v12_4_overlay.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64

          src = Path(".web_preview/felfel_v12_4_overlay.b64").read_text(encoding="utf-8")
          compact = "".join(src.split())
          start = compact.find("UEsDB")
          if start < 0:
              raise SystemExit("ZIP base64 header UEsDB not found")
          payload = compact[start:]
          payload += "=" * ((4 - len(payload) % 4) % 4)
          data = base64.b64decode(payload, validate=False)
          if not data.startswith(b"PK"):
              raise SystemExit("Decoded overlay is not a ZIP")
          Path("/tmp/felfel_v12_4_overlay.zip").write_bytes(data)
          print(f"Recovered overlay ZIP: {len(data)} bytes")
          PY
          unzip -t /tmp/felfel_v12_4_overlay.zip
          unzip -oq /tmp/felfel_v12_4_overlay.zip -d .
          echo "Applied V12.4 phone preview overlay"
          test -f SplashScreen.tscn
          test -f MainMenu.tscn
          test -f LoadingScreen.tscn
          test -f scripts/BootState.gd
          test -f assets/ui/main_menu_bg.svg

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          RELEASE="stable"

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${RELEASE}/Godot_v${GODOT_VERSION}-${RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-${RELEASE}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-${RELEASE}_linux.x86_64" godot
          chmod +x godot

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${RELEASE}/Godot_v${GODOT_VERSION}-${RELEASE}_export_templates.tpz"
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q "Godot_v${GODOT_VERSION}-${RELEASE}_export_templates.tpz" -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${RELEASE}"
          cp -R /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${RELEASE}/"

      - name: Import latest project
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --editor --quit

      - name: Export Web SAFE phone build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          ./godot --headless --verbose --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          printf '%s\n' 'V12.4 Mobile Preview' > build/web/VERSION.txt
          echo "Godot V12.4 mobile preview build ready:"
          ls -lah build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
